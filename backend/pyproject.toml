[build-system]
requires = ["setuptools>=61.0.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "dockercraft-backend"
version = "0.1.0"
description = "FastAPI backend for DockerCraft containerization engine"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.110.0",
    "uvicorn>=0.28.0",
    "docker>=7.0.0",
    "gitpython>=3.1.42",
    "pydantic>=2.6.0",
    "pydantic-settings>=2.2.0",
    "groq>=0.4.0",
    "python-dotenv>=1.0.1",
    "websockets>=12.0"
]
